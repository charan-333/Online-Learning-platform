# Render Blueprint: a PostgreSQL database and one Docker web service.
# Plans below are the smallest; check Render's current plan limits before relying on them.
databases:
  - name: cat100-db
    databaseName: cat100
    user: cat100
    plan: free

services:
  - type: web
    name: cat100
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cat100-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: none
      # Asked for when you create the Blueprint. The admin account is created on first start.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Password-reset email (docs/EMAIL.md). Add EMAIL_PROVIDER=smtp, EMAIL_FROM and the SMTP_*
      # settings in the service's Environment tab once you have an SMTP provider. Until then
      # reset emails are not sent, and Admin -> Email says so.
